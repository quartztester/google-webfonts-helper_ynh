#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "google-webfonts-helper"
name = "Google Webfonts Helper"
description.en = "Self-host and download Google Fonts files and CSS snippets"
description.fr = "Auto-hébergez et téléchargez les fichiers et extraits CSS des Google Fonts"

version = "1.7.2~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://gwfh.mranftl.com"
demo = "https://gwfh.mranftl.com"
admindoc = "https://github.com/majodev/google-webfonts-helper#readme"
code = "https://github.com/majodev/google-webfonts-helper"
fund = "https://github.com/sponsors/majodev"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "300M"
ram.build = "1G"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    # Upstream hardcodes absolute URLs, so the app only works at the root of a domain
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.api_key]
    ask.en = "Google Fonts API key (optional, leave empty for demo mode)"
    ask.fr = "Clé d'API Google Fonts (optionnelle, laissez vide pour le mode démo)"
    help.en = "Create a free key for the 'Web Fonts Developer API' at https://console.cloud.google.com/apis/library/webfonts.googleapis.com then enable it for a project. Without a key the app starts in demo mode with only 3 example fonts."
    help.fr = "Créez une clé gratuite pour la « Web Fonts Developer API » sur https://console.cloud.google.com/apis/library/webfonts.googleapis.com puis activez-la pour un projet. Sans clé, l'application démarre en mode démo avec seulement 3 polices d'exemple."
    type = "string"
    default = ""
    optional = true

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/majodev/google-webfonts-helper/archive/refs/tags/v1.7.2.tar.gz"
    sha256 = "0561f476fe81fb86bfd1c664d72580865cb2c58c4f0f04a83285cf13951a5787"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    # optipng/gifsicle image-optimizer builds in the grunt toolchain compile from source
    packages = ["zlib1g-dev"]

    [resources.nodejs]
    version = "24"
